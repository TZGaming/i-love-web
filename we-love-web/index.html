<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We-love-web</title>
    <link rel="stylesheet" href="../styles/style.css"/>
    <style>
        #demo-lijst.note-grid {
            flex-wrap: wrap;
            justify-content: center;
            gap: 2rem;
            margin: 2rem;
        }

        #demo-lijst.note-grid li.note-card {
            list-style-type: none;
            background: transparent;
            border: none;
            outline: none;
            width: min(240px, 20vw);
            min-height: 140px;
            padding: 0;
            opacity: 1;
        }

        #demo-lijst.note-grid li.note-card button {
            all: unset;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 1rem;
            border-radius: 15px;
            border: 2px solid rgb(78, 78, 78);
            background-color: rgb(0, 0, 0);
            color: white;
            cursor: pointer;
            transition: transform .2s, border .2s, box-shadow .2s, background-color .2s;
        }

        #demo-lijst.note-grid li.note-card button:hover {
            transform: rotateZ(3deg);
            background-color: rgb(7, 7, 7);
            border-color: white;
            box-shadow: 0 0 15px 5px rgba(255, 255, 255, 0.25);
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            z-index: 999;
            backdrop-filter: blur(6px);
        }

        .overlay.hidden {
            display: none;
        }

        .overlay-card {
            position: relative;
            width: min(640px, 100%);
            max-height: calc(100vh - 4rem);
            overflow-y: auto;
            border-radius: 1rem;
            padding: 2rem;
            background: rgba(10, 10, 10, 0.98);
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.65);
        }

        .overlay-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            border: none;
            background: transparent;
            color: white;
            font-size: 2rem;
            line-height: 1;
            cursor: pointer;
        }

        #note-body {
            margin-top: 1rem;
            line-height: 1.6;
            white-space: pre-line;
        }
    </style>
</head>

<body class="bg-alt">
    <nav>
        <a href="../index.html">Home</a>
        <a href="../demos/index.html">Demo's</a>
        <a href="../vragenlijst/index.html">Vragenlijsten</a>
        <a href="../we-love-web/index.html">We-love-web</a>
    </nav>

    <ul id="demo-lijst" class="note-grid">
        <li class="note-card" data-note-title="Joes Koppers over Creative Coding" 
        data-note="Animaties is belangrijk voor elke website. Ook probeert hij veel originele dingen te bedenken wat niet vaak word gezien op het web. Z'n website ziet er heel netjes en cool uit, heel veel bewegingen en zoiets heb ik zelf nog nooit eerder gezien.


        Ik heb een vraag gesteld:

        Hoe zit het met laptops die ouder zijn met slechtere CPUs?

        Joes: Er word (nog) niet rekening gehouden met oudere apparaten, het werkt er wel op maar waarschijnlijk een stuk trager, er zitten geen fallbacks in.


        Websites:

        https://use.media/
        https://biblio-graph.org/public/
        https://nadd.network/
        https://100prcnt.film/">
            <button type="button">Joes Koppers over Creative Coding</button>
        </li>

        <li class="note-card" data-note-title="Bikkelhart" data-note="
        - Dit bedrijf is heel erg gefocused op AI, vooral voor user tests. 
        - Door AI hiervoor te gebruiken is dit proces veel sneller vergeleken met een echt persoon.
        - Ze maken persona's van personen met Gemini, daar hebben ze eigen integratie voor.">
            <button type="button">Bikkelhart</button>
        </li>

    </ul>

    <div id="note-overlay" class="overlay hidden" aria-hidden="true">
        <div class="overlay-card" role="dialog" aria-modal="true" aria-labelledby="note-title">
            <button class="overlay-close" aria-label="Sluiten">×</button>
            <h2 id="note-title"></h2>
            <div id="note-body"></div>
        </div>
    </div>

    <script src="notes.js"></script>
</body>
